name: Proverb review
about: Submit a new proverb or a description/correction for an existing one.
title: "Proverb review: "
labels:
  - proverb
  - pending-review
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping preserve Gikuyu wisdom. Every submission is reviewed by peers before it is accepted or updated.

  - type: dropdown
    id: contribution_type
    attributes:
      label: Contribution type
      description: Choose whether this is a new proverb or a detailed description/correction for an existing proverb.
      options:
        - New proverb
        - Description or correction for an existing proverb
    validations:
      required: true

  - type: textarea
    id: proverb
    attributes:
      label: Gikuyu proverb
      description: Add the original proverb exactly as it should appear in the collection.
      placeholder: Andika thimo yaku...
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Detailed description
      description: Explain the meaning, cultural context, translation, usage, or the correction you are proposing.
      placeholder: Describe the proverb in detail, including context and meaning...
    validations:
      required: true

  - type: textarea
    id: translation
    attributes:
      label: Optional translation or explanation
      description: Add a short English translation or explanation if available.
      placeholder: Short explanation or translation
    validations:
      required: false

  - type: input
    id: source
    attributes:
      label: Source or attribution
      description: Optional — tell us where this came from.
      placeholder: Family, elder, book, or community source
    validations:
      required: false

  - type: checkboxes
    id: consent
    attributes:
      label: Contribution permission
      options:
        - label: I confirm this contribution may be considered for the open-source Thimo cia Gikuyu collection.
          required: true
        - label: I have removed private or identifying information that should not be published.
          required: true
